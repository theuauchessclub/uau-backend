name: Build DirecTV GO EPG

on:
  workflow_dispatch:
  push:
    paths:
      - 'directv-go-epg/**'
      - '.github/workflows/build-directv-go-epg.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build EPG
        run: python directv-go-epg/build_epg.py
      - name: Commit generated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directv-go-epg/directv-go.xml directv-go-epg/match-report.csv directv-go-epg/unmatched.csv directv-go-epg/summary.json
          git diff --cached --quiet || git commit -m "Refresh DirecTV GO EPG"
          git push
