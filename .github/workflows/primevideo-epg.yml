name: Update Prime Video EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "primevideo-epg/build_epg.py"
      - "primevideo-epg/channels-catalog.b64"
      - "primevideo-epg/aliases.json"
      - ".github/workflows/primevideo-epg.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests lxml rapidfuzz

      - name: Expand PRIME channel catalog
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          root = Path('primevideo-epg')
          raw = gzip.decompress(base64.b64decode((root / 'channels-catalog.b64').read_text().strip()))
          (root / 'channels-01.json').write_bytes(raw)
          PY

      - name: Build XMLTV guide
        run: python primevideo-epg/build_epg.py

      - name: Commit refreshed guide
        run: |
          rm -f primevideo-epg/channels-01.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            primevideo-epg/primevideo-us.xml \
            primevideo-epg/primevideo-us.xml.gz \
            primevideo-epg/match-report.csv \
            primevideo-epg/unmatched.csv \
            primevideo-epg/summary.json
          if git diff --cached --quiet; then
            echo "No guide changes to commit."
          else
            git commit -m "Refresh Prime Video EPG"
            git push
          fi
