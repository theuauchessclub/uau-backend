name: Update Prime Video EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "primevideo-epg/build_epg.py"
      - "primevideo-epg/amazon_direct.py"
      - "primevideo-epg/amazon_direct_2b_runner.py"
      - "primevideo-epg/merge_amazon_direct.py"
      - "primevideo-epg/pass3_expand_sources.py"
      - "primevideo-epg/channels-catalog.b64"
      - "primevideo-epg/aliases.json"
      - ".github/workflows/primevideo-epg.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests lxml rapidfuzz beautifulsoup4

      - name: Expand PRIME channel catalog
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          root = Path('primevideo-epg')
          raw = gzip.decompress(base64.b64decode((root / 'channels-catalog.b64').read_text().strip()))
          (root / 'channels-01.json').write_bytes(raw)
          PY

      - name: Pass 2B - crawl Amazon Prime Video pagination
        run: python primevideo-epg/amazon_direct_2b_runner.py

      - name: Build base XMLTV guide
        run: python primevideo-epg/build_epg.py

      - name: Merge Amazon direct schedules
        run: python primevideo-epg/merge_amazon_direct.py

      - name: Pass 3 - expand FAST and linear EPG sources
        run: python primevideo-epg/pass3_expand_sources.py

      - name: Compress final XMLTV guide
        run: |
          python - <<'PY'
          import gzip, shutil
          from pathlib import Path
          root = Path('primevideo-epg')
          with (root / 'primevideo-us.xml').open('rb') as src, gzip.open(root / 'primevideo-us.xml.gz', 'wb', compresslevel=9) as dst:
              shutil.copyfileobj(src, dst)
          PY

      - name: Commit refreshed guide
        run: |
          rm -f primevideo-epg/channels-01.json primevideo-epg/amazon-direct-debug.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            primevideo-epg/primevideo-us.xml \
            primevideo-epg/primevideo-us.xml.gz \
            primevideo-epg/match-report.csv \
            primevideo-epg/unmatched.csv \
            primevideo-epg/summary.json \
            primevideo-epg/amazon-direct.xml \
            primevideo-epg/amazon-direct-report.json \
            primevideo-epg/pass2-report.json \
            primevideo-epg/pass3-report.json
          if git diff --cached --quiet; then
            echo "No guide changes to commit."
          else
            git commit -m "Refresh Prime Video EPG - Pass 2B and Pass 3"
            git push
          fi
