name: Build US Entertainment EPG

on:
  workflow_dispatch:
  push:
    paths:
      - "us-entertainment-epg/**"
      - ".github/workflows/build-us-entertainment-epg.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build normalized XMLTV
        run: python us-entertainment-epg/build_epg.py

      - name: Commit refreshed guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-entertainment-epg/us-entertainment.xml \
                  us-entertainment-epg/match-report.csv \
                  us-entertainment-epg/unmatched.csv \
                  us-entertainment-epg/summary.json
          git diff --cached --quiet || git commit -m "Refresh US Entertainment EPG"
          git push
